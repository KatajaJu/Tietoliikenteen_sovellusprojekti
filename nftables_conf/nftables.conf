#!/usr/sbin/nft -f

#
# Syntax check from CLI: nft -c -f /etc/nftables.conf
#
# Apply the config: nft -f /etc/nftables.conf
#
# Enabling the filtering rules (survives reboots): systemctl enable nftables
#
# List all rules and counters with: nft -a list ruleset
#

# Clear existing nftables rules
flush ruleset

table inet filter {

    chain input {
        type filter hook input priority 0; policy drop;

        # Local loopback traffic
        iifname "lo" accept

        # Trusted IPv4 hosts and networks
        ip saddr 172.20.240.0/23 tcp dport 5000 accept
        ip saddr 193.167.100.97 accept
        ip saddr 10.2.126.225 tcp dport 5000 accept

        # Completely open services
        tcp dport 22 counter accept # SSH (IPv4 + IPv6)
        meta nfproto ipv4 tcp dport 80 accept # HTTP (IPv4 only)

        # Established and related connections
        ct state established,related counter accept

        # Allow IPv4 ping
        ip protocol icmp icmp type echo-request counter accept

        # IPv6 ICMP (NDP, router advertisements, etc.)
        meta l4proto ipv6-icmp accept

        # Optional logging
        ct state { new, invalid } log prefix "DROP NEW "

        # Count and drop new and invalid packets
        ct state { new, invalid } counter drop

        # Count and drop everything else
        counter drop
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }
}
